---
- name: Configure Kubernetes node prerequisites
  hosts: kubernetes
  become: true

  tasks:
    - name: Load required kernel modules at boot
      ansible.builtin.copy:
        dest: /etc/modules-load.d/k8s.conf
        content: |
          overlay
          br_netfilter
        owner: root
        group: root
        mode: "0644"

    - name: Load overlay kernel module
      community.general.modprobe:
        name: overlay
        state: present

    - name: Load bridge netfilter kernel module
      community.general.modprobe:
        name: br_netfilter
        state: present

    - name: Configure networking for Kubernetes
      ansible.builtin.copy:
        dest: /etc/sysctl.d/k8s.conf
        content: |
          net.bridge.bridge-nf-call-iptables = 1
          net.bridge.bridge-nf-call-ip6tables = 1
          net.ipv4.ip_forward = 1
        owner: root
        group: root
        mode: "0644"

    - name: Apply kernel networking settings
      ansible.builtin.command: sysctl --system
      changed_when: false
